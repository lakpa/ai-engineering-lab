<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="980" viewBox="0 0 1360 980" role="img" aria-labelledby="title description">
  <title id="title">Song-chunk RAG pipeline</title>
  <desc id="description">A reference-style flow diagram. Song descriptions and notes are split into chunks, encoded with Ollama's mxbai-embed-large model, and stored with song IDs in Chroma. A listener's question about Last Letter is encoded with the same model to retrieve relevant song chunks. The question, chunks, and prompt template are passed to an LLM, which returns an explanation to the listener.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#243344"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172333; }
    .section { font-size: 29px; font-weight: 700; }
    .box-title { font-size: 26px; font-weight: 700; }
    .label { font-size: 21px; font-weight: 600; }
    .small { font-size: 18px; }
    .box { fill: #fff; stroke: #243344; stroke-width: 2.5; }
    .line { fill: none; stroke: #243344; stroke-width: 3; }
    .arrow { fill: none; stroke: #243344; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <rect width="1360" height="980" fill="#fff"/>

  <!-- Ingestion and retrieval, following the placement of the reference image. -->
  <rect x="210" y="33" width="1105" height="355" class="box"/>
  <text x="762" y="76" text-anchor="middle" class="section">RAG pipeline: ingestion and retrieval</text>

  <!-- Source document icon. -->
  <path d="M45 180 L95 196 L95 276 L45 259 Z" fill="#172333"/>
  <path d="M100 196 L150 180 L150 259 L100 276 Z" fill="#172333"/>
  <path d="M45 175 L95 190 L100 193 L105 190 L150 175" class="line"/>
  <path d="M95 196 V276 M100 196 V276" stroke="#fff" stroke-width="3"/>
  <text x="98" y="311" text-anchor="middle" class="box-title">Song catalog</text>
  <text x="98" y="340" text-anchor="middle" class="small">songs.csv + notes</text>
  <path d="M159 226 H249" class="arrow"/>

  <!-- Four document chunks. -->
  <g fill="#fff" stroke="#243344" stroke-width="2.5">
    <path d="M275 170 H307 L318 181 V218 H275 Z"/>
    <path d="M326 170 H358 L369 181 V218 H326 Z"/>
    <path d="M275 229 H307 L318 240 V277 H275 Z"/>
    <path d="M326 229 H358 L369 240 V277 H326 Z"/>
  </g>
  <g stroke="#243344" stroke-width="2">
    <path d="M282 190 H309 M282 199 H309 M333 190 H360 M333 199 H360 M282 249 H309 M282 258 H309 M333 249 H360 M333 258 H360"/>
  </g>
  <text x="322" y="316" text-anchor="middle" class="box-title">Song text</text>
  <text x="322" y="345" text-anchor="middle" class="box-title">chunks</text>
  <path d="M384 226 H461" class="arrow"/>

  <rect x="475" y="164" width="235" height="126" class="box"/>
  <text x="592" y="211" text-anchor="middle" class="box-title">Embedding</text>
  <text x="592" y="246" text-anchor="middle" class="box-title">model</text>
  <text x="592" y="273" text-anchor="middle" class="small">mxbai-embed-large</text>

  <path d="M728 198 H1008" class="arrow"/>
  <text x="868" y="180" text-anchor="middle" class="label">Song chunk embeddings</text>
  <path d="M728 262 H1008" class="arrow"/>
  <text x="868" y="300" text-anchor="middle" class="label">Query embedding</text>

  <rect x="1023" y="164" width="238" height="126" class="box"/>
  <text x="1142" y="209" text-anchor="middle" class="box-title">Chroma vector</text>
  <text x="1142" y="245" text-anchor="middle" class="box-title">database</text>
  <text x="1142" y="274" text-anchor="middle" class="small">text + song IDs + vectors</text>

  <!-- User question reaches the same embedding model. -->
  <circle cx="103" cy="538" r="29" class="box"/>
  <path d="M54 619 C56 585 79 573 103 573 C127 573 150 585 152 619 Z" class="box"/>
  <text x="103" y="655" text-anchor="middle" class="box-title">User</text>
  <path d="M103 503 V447 H592 V306" class="arrow"/>
  <text x="345" y="435" text-anchor="middle" class="label">Why Last Letter?</text>

  <!-- Retrieved chunks flow into the prompt assembly. -->
  <path d="M1142 305 V531" class="arrow"/>
  <text x="1184" y="434" class="label">Retrieved</text>
  <text x="1184" y="463" class="label">song text</text>
  <text x="1184" y="492" class="label">chunks</text>

  <rect x="980" y="546" width="333" height="387" class="box"/>
  <text x="1146" y="587" text-anchor="middle" class="section">Augmentation</text>
  <rect x="1014" y="615" width="265" height="77" class="box"/>
  <text x="1146" y="645" text-anchor="middle" class="box-title">Prompt template</text>
  <text x="1146" y="675" text-anchor="middle" class="small">grounding instructions</text>
  <text x="1146" y="719" text-anchor="middle" class="box-title">+</text>
  <rect x="1014" y="735" width="265" height="77" class="box"/>
  <text x="1146" y="766" text-anchor="middle" class="box-title">Song chunks</text>
  <text x="1146" y="795" text-anchor="middle" class="small">with song IDs</text>
  <text x="1146" y="837" text-anchor="middle" class="box-title">+</text>
  <rect x="1014" y="851" width="265" height="58" class="box"/>
  <text x="1146" y="889" text-anchor="middle" class="box-title">Why Last Letter?</text>

  <!-- The augmented prompt goes to the LLM, then the response returns to the user. -->
  <path d="M963 762 H749" class="arrow"/>
  <text x="856" y="737" text-anchor="middle" class="label">Augmented prompt</text>
  <rect x="435" y="676" width="296" height="236" class="box"/>
  <text x="583" y="720" text-anchor="middle" class="section">Generation</text>
  <text x="583" y="813" text-anchor="middle" font-size="60">✦</text>
  <text x="583" y="866" text-anchor="middle" class="box-title">LLM</text>
  <path d="M419 794 H103 V671" class="arrow"/>
  <text x="266" y="826" text-anchor="middle" class="label">Response</text>
</svg>
