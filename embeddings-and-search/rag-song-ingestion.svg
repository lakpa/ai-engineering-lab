<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title description">
  <title id="title">Song data ingestion pipeline</title>
  <desc id="description">Song catalog data from songs.csv and notes is split into text chunks that retain song IDs. The mxbai-embed-large model converts each chunk to an embedding. Chroma stores the chunk text, song ID, and embedding for retrieval.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1 1 L10 6 L1 11 Z" fill="#244c66"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #183047; }
    .heading { font-size: 34px; font-weight: 700; }
    .card-title { font-size: 27px; font-weight: 700; }
    .detail { font-size: 20px; }
    .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 1.4px; fill: #246a74; }
    .flow { fill: none; stroke: #244c66; stroke-width: 4; marker-end: url(#arrow); }
    .card { fill: #fff; stroke: #42637a; stroke-width: 2.5; rx: 14; }
  </style>
  <rect width="1440" height="480" fill="#fff"/>

  <!-- The source remains outside the offline ingestion process, as in the reference. -->
  <rect x="315" y="28" width="1083" height="422" fill="#f5fafb" stroke="#90a9b3" stroke-width="2.5" rx="18"/>
  <text x="856" y="80" class="heading" text-anchor="middle">Data ingestion pipeline</text>
  <text x="856" y="111" class="detail" text-anchor="middle">Prepare searchable song evidence before a listener asks a question</text>

  <rect x="36" y="164" width="242" height="181" class="card"/>
  <path d="M98 191 H145 L163 209 V262 H98 Z" fill="#e6f1f2" stroke="#246a74" stroke-width="2.5"/>
  <path d="M145 191 V209 H163" fill="none" stroke="#246a74" stroke-width="2.5"/>
  <path d="M111 225 H148 M111 236 H148 M111 247 H137" stroke="#246a74" stroke-width="2.5"/>
  <text x="157" y="297" class="card-title" text-anchor="middle">Song catalog</text>
  <text x="157" y="326" class="detail" text-anchor="middle">songs.csv + notes</text>
  <path d="M280 254 H351" class="flow"/>

  <rect x="365" y="164" width="244" height="181" class="card"/>
  <rect x="391" y="191" width="191" height="31" fill="#e6f1f2" stroke="#246a74" stroke-width="2" rx="4"/>
  <rect x="391" y="229" width="191" height="31" fill="#e6f1f2" stroke="#246a74" stroke-width="2" rx="4"/>
  <rect x="391" y="267" width="191" height="31" fill="#e6f1f2" stroke="#246a74" stroke-width="2" rx="4"/>
  <text x="486" y="213" class="detail" text-anchor="middle">Last Letter · chunk 1</text>
  <text x="486" y="251" class="detail" text-anchor="middle">First Light · chunk 1</text>
  <text x="486" y="289" class="detail" text-anchor="middle">More song notes</text>
  <text x="487" y="327" class="card-title" text-anchor="middle">Split into chunks</text>
  <text x="487" y="383" class="detail" text-anchor="middle">Keep each chunk’s song ID</text>
  <path d="M612 254 H686" class="flow"/>

  <rect x="701" y="164" width="270" height="181" class="card"/>
  <circle cx="836" cy="218" r="31" fill="#e6f1f2" stroke="#246a74" stroke-width="2.5"/>
  <circle cx="821" cy="207" r="5" fill="#246a74"/>
  <circle cx="849" cy="201" r="5" fill="#246a74"/>
  <circle cx="840" cy="230" r="5" fill="#246a74"/>
  <path d="M825 208 L845 202 M823 211 L838 227 M847 206 L841 225" stroke="#246a74" stroke-width="2.5"/>
  <text x="836" y="288" class="card-title" text-anchor="middle">Embed each chunk</text>
  <text x="836" y="320" class="detail" text-anchor="middle">mxbai-embed-large</text>
  <text x="836" y="383" class="detail" text-anchor="middle">One vector per chunk</text>
  <path d="M974 254 H1047" class="flow"/>

  <rect x="1062" y="164" width="289" height="181" class="card"/>
  <ellipse cx="1206" cy="203" rx="47" ry="13" fill="#e6f1f2" stroke="#246a74" stroke-width="2.5"/>
  <path d="M1159 203 V249 C1159 266 1253 266 1253 249 V203" fill="#e6f1f2" stroke="#246a74" stroke-width="2.5"/>
  <path d="M1159 226 C1159 243 1253 243 1253 226" fill="none" stroke="#246a74" stroke-width="2.5"/>
  <text x="1206" y="297" class="card-title" text-anchor="middle">Chroma</text>
  <text x="1206" y="326" class="detail" text-anchor="middle">vector database</text>
  <text x="1206" y="383" class="detail" text-anchor="middle">Text + song ID + vector</text>

  <text x="856" y="425" class="eyebrow" text-anchor="middle">OFFLINE OR BACKGROUND UPDATE</text>
</svg>
