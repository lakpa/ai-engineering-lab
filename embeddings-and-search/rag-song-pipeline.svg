<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="970" viewBox="0 0 1360 970" role="img" aria-labelledby="title description">
  <title id="title">RAG pipeline for a song recommendation explanation</title>
  <desc id="description">Three stages. First, song titles and descriptions are embedded with MiniLM and stored with song IDs in Chroma. Second, the three liked song embeddings are averaged to search Chroma for an unheard recommendation, Last Letter. Third, the liked and recommended song records are placed in a prompt for a language model, which drafts an explanation supported by those records.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#4c6075"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1c2a3b; }
    .title { font-size: 34px; font-weight: 700; }
    .subtitle { font-size: 20px; fill: #526376; }
    .stage { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
    .card-title { font-size: 18px; font-weight: 700; fill: #245a73; letter-spacing: .8px; }
    .body { font-size: 20px; }
    .small { font-size: 18px; }
    .note { font-size: 18px; font-weight: 600; fill: #526376; }
    .stage-box { stroke-width: 2; rx: 18; }
    .card { fill: #fff; stroke: #62778a; stroke-width: 2; rx: 12; }
    .flow { fill: none; stroke: #4c6075; stroke-width: 3; marker-end: url(#arrow); }
    .stage-flow { fill: none; stroke: #7b8b99; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <rect width="1360" height="970" fill="#fff"/>
  <text x="680" y="48" text-anchor="middle" class="title">From song catalog to grounded explanation</text>
  <text x="680" y="82" text-anchor="middle" class="subtitle">One catalog, one listener, one recommendation to explain</text>

  <rect x="50" y="111" width="1260" height="239" class="stage-box" fill="#eef7fb" stroke="#93bdcf"/>
  <text x="83" y="150" class="stage">1  INDEX THE CATALOG</text>
  <rect x="82" y="178" width="255" height="137" class="card"/>
  <text x="103" y="210" class="card-title">SONG CATALOG</text>
  <text x="103" y="249" class="body">songs.csv</text>
  <text x="103" y="281" class="small">24 fictional songs</text>
  <path d="M344 247 H380" class="flow"/>
  <rect x="388" y="178" width="255" height="137" class="card"/>
  <text x="409" y="210" class="card-title">SONG RECORDS</text>
  <text x="409" y="249" class="body">Title + description</text>
  <text x="409" y="281" class="small">one record per song</text>
  <path d="M650 247 H686" class="flow"/>
  <rect x="694" y="178" width="255" height="137" class="card"/>
  <text x="715" y="210" class="card-title">EMBEDDING MODEL</text>
  <text x="715" y="249" class="body">MiniLM converts text</text>
  <text x="715" y="281" class="small">to vectors</text>
  <path d="M956 247 H992" class="flow"/>
  <rect x="1000" y="178" width="278" height="137" class="card"/>
  <text x="1021" y="210" class="card-title">CHROMA COLLECTION</text>
  <text x="1021" y="249" class="body">Song IDs, text,</text>
  <text x="1021" y="281" class="small">and vectors are stored</text>

  <path d="M680 350 V379" class="stage-flow"/>
  <text x="705" y="372" class="note">Use the indexed songs</text>

  <rect x="50" y="390" width="1260" height="239" class="stage-box" fill="#f2f7f1" stroke="#a7c7a1"/>
  <text x="83" y="429" class="stage">2  RETRIEVE AN UNHEARD SONG</text>
  <rect x="82" y="457" width="255" height="137" class="card"/>
  <text x="103" y="489" class="card-title">LISTENER LIKES</text>
  <text x="103" y="521" class="small">First Light</text>
  <text x="103" y="548" class="small">Begin Again</text>
  <text x="103" y="575" class="small">Morning Resolve</text>
  <path d="M344 526 H380" class="flow"/>
  <rect x="388" y="457" width="255" height="137" class="card"/>
  <text x="409" y="489" class="card-title">TASTE VECTOR</text>
  <text x="409" y="526" class="small">Average their stored</text>
  <text x="409" y="557" class="small">song embeddings</text>
  <path d="M650 526 H686" class="flow"/>
  <rect x="694" y="457" width="255" height="137" class="card"/>
  <text x="715" y="489" class="card-title">VECTOR SEARCH</text>
  <text x="715" y="526" class="small">Query Chroma and</text>
  <text x="715" y="557" class="small">exclude liked songs</text>
  <path d="M956 526 H992" class="flow"/>
  <rect x="1000" y="457" width="278" height="137" class="card"/>
  <text x="1021" y="489" class="card-title">RECOMMENDATION</text>
  <text x="1021" y="526" class="body">Last Letter</text>
  <text x="1021" y="557" class="small">an unheard candidate</text>

  <path d="M680 629 V658" class="stage-flow"/>
  <text x="705" y="651" class="note">Fetch records for the three likes and Last Letter</text>

  <rect x="50" y="669" width="1260" height="239" class="stage-box" fill="#fff8ed" stroke="#dec49d"/>
  <text x="83" y="708" class="stage">3  GENERATE AN EVIDENCE-BASED EXPLANATION</text>
  <rect x="82" y="736" width="255" height="137" class="card"/>
  <text x="103" y="768" class="card-title">EVIDENCE</text>
  <text x="103" y="806" class="small">Four song descriptions</text>
  <text x="103" y="837" class="small">and their source IDs</text>
  <path d="M344 805 H380" class="flow"/>
  <rect x="388" y="736" width="255" height="137" class="card"/>
  <text x="409" y="768" class="card-title">AUGMENTED PROMPT</text>
  <text x="409" y="806" class="small">Question + records +</text>
  <text x="409" y="837" class="small">grounding instructions</text>
  <path d="M650 805 H686" class="flow"/>
  <rect x="694" y="736" width="255" height="137" class="card"/>
  <text x="715" y="768" class="card-title">LANGUAGE MODEL</text>
  <text x="715" y="806" class="small">Writes an explanation</text>
  <text x="715" y="837" class="small">from supplied context</text>
  <path d="M956 805 H992" class="flow"/>
  <rect x="1000" y="736" width="278" height="137" class="card"/>
  <text x="1021" y="768" class="card-title">ANSWER TO LISTENER</text>
  <text x="1021" y="806" class="small">Shared breakup theme;</text>
  <text x="1021" y="837" class="small">bittersweet mood caveat</text>

  <text x="680" y="944" text-anchor="middle" class="subtitle">The explanation describes catalog text; it cannot prove the listener will enjoy the song.</text>
</svg>
